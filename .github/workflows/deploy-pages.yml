name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build info and cache-bust assets
        run: |
          SHA="${GITHUB_SHA::7}"
          TIME="$(TZ='Asia/Tokyo' date +"%Y-%m-%d %H:%M:%S")"
          cat > js/build-info.js <<EOT
          window.BUILD_INFO = { sha: '${SHA}', time: '${TIME}' };
          EOT
          sed -i "s/\.js\"><\/script>/.js?v=${SHA}\"><\/script>/g" index.html
          sed -i "s/style\.css\">/style.css?v=${SHA}\">/" index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
